@if (loading()) {
  <p>Loading salons…</p>
} @else if (error()) {
  <p>Error loading salons: {{ error() }}</p>
} @else {
  <label>
    Salon:
    <select (change)="onSelect($event)">
      <option value="" disabled selected>Select a salon</option>
      @for (salon of salons(); track salon.id) {
        <option [value]="salon.id">{{ salon.name }}</option>
      }
    </select>
  </label>
}
